name: Publish NuGet Package

# Publica en nuget.org con Trusted Publishing (sin API key guardada).
# Se dispara al empujar un tag vX.Y.Z; la versión del paquete sale del tag.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # token OIDC para NuGet/login

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build Softbetamx.Rfid.sln -c Release -p:Version=$VERSION

      - name: Test
        run: dotnet test Softbetamx.Rfid.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/Softbetamx.Rfid/Softbetamx.Rfid.csproj -c Release --no-build -p:Version=$VERSION -o nupkgs

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: softbetamx

      - name: NuGet push
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
